name: CMake
on:
  push:
    branches: [ "master", "vst3" ]
  pull_request:
    branches: [ "master", "vst3" ]

env:
  BUILD_TYPE: Release

jobs:
  windows:
    runs-on: windows-latest
    env:
      BOOST_VERSION: 1.78.0
      BOOST_PATH: ${{github.workspace}}/boost/

    steps:
    - uses: actions/checkout@v4

    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Cache boost
      uses: actions/cache@v4
      id: cache-boost
      with:
        path: ${{env.BOOST_PATH}}
        key: boost-${{env.BOOST_VERSION}}

    - name: Install boost
      if: steps.cache-boost.outputs.cache-hit != 'true'
      id: install-boost
      uses: MarkusJx/install-boost@v2.3.0
      with:
        boost_version: ${{env.BOOST_VERSION}}
        boost_install_dir: ${{env.BOOST_PATH}}
        platform_version: 2022
        toolset: msvc

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
      env:
        BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Install dependencies
      run: brew install boost flex bison ninja

    - name: Configure CMake
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DENGINE_SIM_HEADLESS=ON \
          -DENGINE_SIM_PLUGIN=ON \
          -DDISCORD_ENABLED=OFF \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

    - name: Build AU and VST3
      run: cmake --build build --target EngineSimPlugin_AU EngineSimPlugin_VST3

    - name: Verify arm64-only binaries
      run: |
        set -euo pipefail
        au_bin="build/plugin/EngineSimPlugin_artefacts/Release/AU/Engine Sim.component/Contents/MacOS/Engine Sim"
        vst_bin="build/plugin/EngineSimPlugin_artefacts/Release/VST3/Engine Sim.vst3/Contents/MacOS/Engine Sim"
        for bin in "$au_bin" "$vst_bin"; do
          archs="$(lipo -archs "$bin")"
          echo "$bin: $archs"
          test "$archs" = "arm64"
        done

    - name: Upload plugins
      uses: actions/upload-artifact@v4
      with:
        name: engine-sim-macos-arm64
        path: |
          build/plugin/EngineSimPlugin_artefacts/Release/AU/Engine Sim.component
          build/plugin/EngineSimPlugin_artefacts/Release/VST3/Engine Sim.vst3
